<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tulips for Sei</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg1:#ddd5ea;--bg2:#b8abcf;--ink:#2b1b4d;--btn:#2b1b4d;--btnt:#f3ebdd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3d3160;--bg2:#241b3d;--ink:#eadff7;--btn:#eadff7;--btnt:#241b3d}}
:root[data-theme="dark"]{--bg1:#3d3160;--bg2:#241b3d;--ink:#eadff7;--btn:#eadff7;--btnt:#241b3d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;background:linear-gradient(var(--bg1),var(--bg2));color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif}
canvas{width:100%;max-width:460px;height:auto;display:block;cursor:pointer}
h1{margin:0;font-size:clamp(28px,7vw,40px);font-weight:500;font-style:italic;letter-spacing:.01em}
button{font:inherit;font-size:18px;font-style:italic;padding:9px 22px;border:0;border-radius:999px;background:var(--btn);color:var(--btnt);cursor:pointer}
button:focus-visible{outline:3px solid #9a5cc8;outline-offset:3px}
</style></head><body>
<h1>for Sei</h1>
<canvas id="c" width="400" height="570" aria-label="A bouquet of purple, black and navy tulips slowly blooming"></canvas>
<button id="b" type="button">Bloom again</button>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),dpr=Math.min(window.devicePixelRatio||1,2);
cv.width=400*dpr;cv.height=570*dpr;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cl=v=>Math.max(0,Math.min(1,v)),eo=t=>1-Math.pow(1-t,3),eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const hx=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mix=(a,b,t)=>{const A=hx(a),B=hx(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join()+')'};
const P0=[200,470];
const F=[
{c:'#6b2fa0',x:200,y:172,s:1.1,d:1.1},{c:'#1d1826',x:140,y:205,s:1.05,d:.3},{c:'#24347a',x:262,y:202,s:1.05,d:.45},
{c:'#45206f',x:90,y:262,s:1,d:0},{c:'#1d1826',x:310,y:258,s:1,d:.15},{c:'#9a5cc8',x:176,y:252,s:.95,d:.6},{c:'#1c2760',x:228,y:255,s:.95,d:.75}
].sort((a,b)=>a.y-b.y);
const LV=[[-172,305,16,0],[-132,225,14,.2],[-84,165,12,.4],[172,305,16,.1],[132,225,14,.3],[84,165,12,.5]];
function petal(x0,tx,ty,w,col,dark,s){
ctx.beginPath();ctx.moveTo(x0-w*.75,0);
ctx.bezierCurveTo(x0-w*1.3,ty*.35,tx-w*.75,ty*.8,tx,ty);
ctx.bezierCurveTo(tx+w*.75,ty*.8,x0+w*1.3,ty*.35,x0+w*.75,0);
ctx.quadraticCurveTo(x0,7*s,x0-w*.75,0);ctx.closePath();
const g=ctx.createLinearGradient(x0,0,tx,ty);
g.addColorStop(0,mix(col,'#000000',.55));g.addColorStop(.5,col);g.addColorStop(1,mix(col,'#ffffff',.26));
ctx.fillStyle=g;ctx.fill();
if(dark){ctx.fillStyle='rgba(6,3,14,.4)';ctx.fill()}
ctx.strokeStyle='rgba(6,3,14,.35)';ctx.lineWidth=.8;ctx.stroke();
ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=1.6*s;ctx.lineCap='round';
ctx.beginPath();ctx.moveTo(x0+(tx-x0)*.15,ty*.12);ctx.quadraticCurveTo(x0+(tx-x0)*.5-w*.2,ty*.5,tx-w*.1,ty*.88);ctx.stroke();
}
function tulip(x,y,rot,s,b,col){
ctx.save();ctx.translate(x,y);ctx.rotate(rot);
const L=74*s,w=(12+4*b)*s,sp=(5+24*b)*s;
[-1,1,0].forEach(k=>petal(k*3*s,k*sp,-L*(1-.08*b*Math.abs(k)),w,col,true,s));
if(b>.3){const a=cl((b-.3)/.4);ctx.globalAlpha=a;
ctx.fillStyle=mix(col,'#000000',.8);ctx.beginPath();ctx.ellipse(0,-L*.42,sp*.8,L*.3*b,0,0,7);ctx.fill();
[-1,0,1].forEach(k=>{ctx.strokeStyle='#bfae62';ctx.lineWidth=1.4*s;ctx.beginPath();ctx.moveTo(0,-L*.3);ctx.lineTo(k*sp*.3,-L*(.55+.15*b));ctx.stroke();
ctx.fillStyle='#d8c47a';ctx.beginPath();ctx.arc(k*sp*.3,-L*(.55+.15*b),2*s,0,7);ctx.fill()});
ctx.globalAlpha=1}
[-.62,.62].forEach(k=>petal(k*5*s,k*sp*1.15,-L*(1-.05*b),w*.95,col,false,s));
petal(0,0,-L*(1-.36*b),w*1.02,col,false,s);
ctx.restore();
}
function leaf(dx,ty,w,d,T){
const g=eo(cl((T-.3-d)/1.8));if(g<=0)return;
const B=[200,400],Tp=[B[0]+dx*g,B[1]+(ty-B[1])*g];
const mx=(B[0]+Tp[0])/2+Math.sign(dx)*10*g,my=(B[1]+Tp[1])/2-22*g;
const nx=-(Tp[1]-B[1]),ny=Tp[0]-B[0],n=Math.hypot(nx,ny)||1,ux=nx/n*w*g,uy=ny/n*w*g;
const gr=ctx.createLinearGradient(B[0],B[1],Tp[0],Tp[1]);gr.addColorStop(0,'#0f2c1f');gr.addColorStop(1,'#2f7a52');
ctx.beginPath();ctx.moveTo(B[0],B[1]);ctx.quadraticCurveTo(mx+ux,my+uy,Tp[0],Tp[1]);ctx.quadraticCurveTo(mx-ux,my-uy,B[0],B[1]);
ctx.fillStyle=gr;ctx.fill();ctx.strokeStyle='rgba(180,240,200,.22)';ctx.lineWidth=1;
ctx.beginPath();ctx.moveTo(B[0],B[1]);ctx.quadraticCurveTo(mx,my,Tp[0],Tp[1]);ctx.stroke();
}
function paper(T){
const a=eo(cl(T/.9));ctx.save();ctx.globalAlpha=a;ctx.translate(0,(1-a)*40);
let g=ctx.createLinearGradient(78,0,322,0);g.addColorStop(0,'#33165a');g.addColorStop(.5,'#5b2b8f');g.addColorStop(1,'#33165a');
ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(78,296);ctx.quadraticCurveTo(200,270,322,296);ctx.lineTo(222,548);ctx.lineTo(178,548);ctx.closePath();ctx.fill();
g=ctx.createLinearGradient(112,0,288,0);g.addColorStop(0,'#141d48');g.addColorStop(.5,'#2a3a7c');g.addColorStop(1,'#141d48');
ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(112,318);ctx.quadraticCurveTo(200,342,288,318);ctx.lineTo(212,548);ctx.lineTo(188,548);ctx.closePath();ctx.fill();
ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(112,318);ctx.quadraticCurveTo(200,342,288,318);ctx.stroke();
ctx.strokeStyle='rgba(0,0,0,.28)';[[150,330,190,540],[250,330,210,540],[200,338,200,544]].forEach(l=>{ctx.beginPath();ctx.moveTo(l[0],l[1]);ctx.lineTo(l[2],l[3]);ctx.stroke()});
ctx.fillStyle='#100c17';ctx.beginPath();ctx.moveTo(146,404);ctx.quadraticCurveTo(200,424,254,404);ctx.lineTo(250,422);ctx.quadraticCurveTo(200,442,150,422);ctx.closePath();ctx.fill();
ctx.strokeStyle='#4a3a66';ctx.lineWidth=1;
[[-1],[1]].forEach(k=>{const m=k[0];ctx.fillStyle='#14101c';ctx.beginPath();ctx.moveTo(200,420);ctx.bezierCurveTo(200+m*32,388,200+m*58,414,200+m*36,432);ctx.bezierCurveTo(200+m*22,436,200+m*8,430,200,420);ctx.fill();ctx.stroke();
ctx.fillStyle='#14101c';ctx.beginPath();ctx.moveTo(200,420);ctx.lineTo(200+m*30,472);ctx.lineTo(200+m*17,466);ctx.lineTo(200+m*8,480);ctx.closePath();ctx.fill()});
ctx.fillStyle='#241a38';ctx.beginPath();ctx.arc(200,422,7,0,7);ctx.fill();ctx.stroke();
ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(170,404);ctx.quadraticCurveTo(164,412,170,420);ctx.stroke();
ctx.strokeStyle='#14101c';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(207,428);ctx.quadraticCurveTo(236,440,246,470);ctx.stroke();
ctx.translate(252,486);ctx.rotate(.14);ctx.fillStyle='#f3ebdd';ctx.strokeStyle='#2b1b4d';ctx.lineWidth=1;ctx.fillRect(-36,-16,72,34);ctx.strokeRect(-36,-16,72,34);
ctx.fillStyle='#e6dcc8';ctx.beginPath();ctx.arc(-27,-8,3,0,7);ctx.fill();ctx.stroke();
ctx.fillStyle='#2b1b4d';ctx.font='italic 500 19px "Cormorant Garamond",Georgia,serif';ctx.textAlign='center';ctx.fillText('for Sei',4,7);
ctx.restore();
}
let t0=performance.now();
document.getElementById('b').onclick=()=>{t0=performance.now()};cv.onclick=()=>{t0=performance.now()};
function frame(now){
const T=reduce?99:(now-t0)/1000,sw=reduce?0:1;
ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,400,570);
ctx.fillStyle='rgba(30,15,55,.22)';ctx.beginPath();ctx.ellipse(200,556,62,9,0,0,7);ctx.fill();
LV.forEach(l=>leaf(l[0],l[1],l[2],l[3],T));
const pos=F.map((f,i)=>{
const loc=T-.5-f.d,g=eo(cl(loc/1.8)),b=eio(cl((loc-1.6)/2.8)),k=Math.sin(T*.9+i*1.7)*sw*3*g;
const Ex=f.x+k,Ey=f.y,Cx=200+(f.x-200)*.25+k/2,Cy=470+(f.y-470)*.55;
const u=1-g,bx=u*u*200+2*u*g*Cx+g*g*Ex,by=u*u*470+2*u*g*Cy+g*g*Ey;
const dx=2*u*(Cx-200)+2*g*(Ex-Cx),dy=2*u*(Cy-470)+2*g*(Ey-Cy);
if(g>0){ctx.beginPath();ctx.moveTo(200,470);for(let j=1;j<=24;j++){const q=g*j/24,v=1-q;ctx.lineTo(v*v*200+2*v*q*Cx+q*q*Ex,v*v*470+2*v*q*Cy+q*q*Ey)}
ctx.lineCap='round';ctx.strokeStyle='#194a33';ctx.lineWidth=4.6;ctx.stroke();ctx.strokeStyle='#3b8460';ctx.lineWidth=1.4;ctx.stroke()}
return{f,g,b,bx,by,rot:Math.atan2(dy,dx)+Math.PI/2,sc:f.s*(.6+.4*eo(cl(loc/3.5)))};
});
pos.forEach(p=>{if(p.g>.05)tulip(p.bx,p.by,p.rot,p.sc,p.b,p.f.c)});
paper(T);
requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
